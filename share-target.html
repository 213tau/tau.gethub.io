<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shared Image Viewer</title>
</head>
<body>
  <h1>Received Shared Image</h1>
  <img id="sharedImage" style="max-width: 100%; margin-top: 20px;" />
  <script>
    const params = new URLSearchParams(location.search);
    const imageUrl = params.get('image');
    if (imageUrl) {
      document.getElementById('sharedImage').src = imageUrl;
    }
  </script>
</body>
</html>
