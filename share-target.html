<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Share Target</title>
</head>
<body>
  <h1>Receiving shared files...</h1>
  <script>
    if (window.location.pathname.endsWith("share-target.html")) {
      navigator.serviceWorker?.ready.then(reg => {
        // forward POST data from service worker to your app (index.html)
        console.log("Share target opened");
        alert("tau");
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
