<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#317EFB"/>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <title>PWA File & Image Share</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
      color: #333;
      text-align: center;
    }
    textarea {
      margin-top: 20px;
      width: 90%;
      max-width: 800px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    img {
      margin-top: 20px;
      max-width: 90%;
      display: none;
    }
  </style>
</head>
<body>
  <h1>PWA File & Image Sharing</h1>

  <button id="openFile">Open File</button>
  <button id="saveFile">Save File</button>
  <button id="downloadFile">Download</button>
  <textarea id="textArea" rows="10" placeholder="Text file content..."></textarea>

  <hr>

  <input type="file" id="imageInput" accept="image/*" />
  <br>
  <img id="previewImage" alt="Selected Image" />
  <br>
  <button id="downloadImage">Download Image</button>
  <button id="shareImage">Share Image</button>

  <script>
    let fileHandle;
    const textarea = document.getElementById('textArea');
    const imageInput = document.getElementById('imageInput');
    const previewImage = document.getElementById('previewImage');

    document.getElementById('openFile').addEventListener('click', async () => {
      if ('showOpenFilePicker' in window) {
        try {
          [fileHandle] = await window.showOpenFilePicker();
          const file = await fileHandle.getFile();
          textarea.value = await file.text();
        } catch (err) {
          console.error('File open error:', err);
        }
      } else {
        alert('File System Access API not supported.');
      }
    });

    document.getElementById('saveFile').addEventListener('click', async () => {
      if ('showSaveFilePicker' in window) {
        try {
          if (!fileHandle) {
            fileHandle = await window.showSaveFilePicker();
          }
          const writable = await fileHandle.createWritable();
          await writable.write(textarea.value);
          await writable.close();
          alert('File saved!');
        } catch (err) {
          console.error('Save error:', err);
        }
      } else {
        alert('File System Access API not supported.');
      }
    });

    document.getElementById('downloadFile').addEventListener('click', () => {
      const blob = new Blob([textarea.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'download.txt';
      a.click();
      URL.revokeObjectURL(url);
    });

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = () => {
          previewImage.src = reader.result;
          previewImage.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('downloadImage').addEventListener('click', () => {
      if (previewImage.src) {
        const a = document.createElement('a');
        a.href = previewImage.src;
        a.download = 'image.png';
        a.click();
      } else {
        alert('No image to download.');
      }
    });

    document.getElementById('shareImage').addEventListener('click', async () => {
      const file = imageInput.files[0];
      if (!file) {
        alert('Please select an image first.');
        return;
      }

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Shared Image',
            text: 'Check out this image!',
          });
        } catch (error) {
          console.error('Error sharing image:', error);
        }
      } else {
        alert('Sharing not supported on this device.');
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
